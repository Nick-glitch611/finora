{% extends "base.html" %}

{% block title %}Entrar | Finora{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <div class="auth-header">
            <span class="auth-label">BEM-VINDO DE VOLTA</span>
            <h1>Entre na sua conta</h1>
            <p>Continue acompanhando suas finanças com tranquilidade.</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST" class="auth-form">

            <div class="form-group">
                <label for="usuario">Nome de usuário</label>
                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Digite seu usuário"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="primary-button auth-button">
                Entrar na conta
            </button>

        </form>

        <p class="auth-footer">
            Ainda não tem uma conta?
            <a href="{{ url_for('cadastro') }}">Cadastre-se</a>
        </p>

        <a href="{{ url_for('index') }}" class="back-link">
            Voltar para o início
        </a>

    </div>

</section>

{% endblock %}
