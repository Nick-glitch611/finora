{% extends "base.html" %}

{% block title %}Criar conta | Finora{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <div class="auth-header">
            <span class="auth-label">COMECE SUA JORNADA</span>
            <h1>Crie sua conta</h1>
            <p>Organize seu dinheiro e construa hábitos financeiros melhores.</p>
        </div>

        <form action="{{ url_for('cadastro') }}" method="POST" class="auth-form">

            <div class="form-group">
                <label for="usuario">Nome de usuário</label>
                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Escolha um nome de usuário"
                    autocomplete="username"
                    minlength="3"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seuemail@exemplo.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Crie uma senha"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmar_senha">Confirmar senha</label>
                <input
                    type="password"
                    id="confirmar_senha"
                    name="confirmar_senha"
                    placeholder="Digite sua senha novamente"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >
            </div>

            <button type="submit" class="primary-button auth-button">
                Criar minha conta
            </button>

        </form>

        <p class="auth-footer">
            Já tem uma conta?
            <a href="{{ url_for('login') }}">Entrar</a>
        </p>

        <a href="{{ url_for('index') }}" class="back-link">
            Voltar para o início
        </a>

    </div>

</section>

{% endblock %}
